<!DOCTYPE html>
<head>
<title>SPDRM</title>
<meta name="description" content="SPDRM — a zero-dependency single-page site built from one JSON file">
<meta name="keywords" content="spdrm, spa, vanilla js, static site">
<meta name="author" content="SoupNet Technologies">
<meta charset="UTF-8">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5e5aba">
<link rel="manifest" href="manifest.json">
<style>
:root{--background:#1e1f26;--background2:#131419;--text:#e8e9f3;--text2:#c9cce4;--borders:#6e738a;--primaccent:#5e5aba;--secaccent:#817ee3;}@keyframes flowing{from{color:var(--primaccent);margin-bottom:10vmin;border-bottom:0px solid var(--primaccent);box-shadow:0 7vmin 5vmin 1vmin var(--primaccent);}to{color:var(--text);margin-bottom:0vmin;border-bottom:1px solid var(--borders);box-shadow:0 0 0 0 var(--borders);}}@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}@keyframes trippy{0%{text-shadow:0 0 5px #ff0000,0 0 10px #00ff00,0 0 15px #0000ff;}25%{text-shadow:0 0 5px #00ff00,0 0 10px #0000ff,0 0 15px #ff0000;}50%{text-shadow:0 0 5px #0000ff,0 0 10px #ff0000,0 0 15px #00ff00;}75%{text-shadow:0 0 5px #ff0000,0 0 10px #00ff00,0 0 15px #0000ff;}100%{text-shadow:0 0 5px #00ff00,0 0 10px #0000ff,0 0 15px #ff0000;}}@keyframes chromatic-abhorration{0%{filter:hue-rotate(0deg);}25%{filter:hue-rotate(90deg);}50%{filter:hue-rotate(180deg);}75%{filter:hue-rotate(270deg);}100%{filter:hue-rotate(360deg);}}.shakey{animation:shakeyanim 0.2s;}@keyframes shakeyanim{0%{transform:translate(100%,-100%) scale(1.95) rotate(15deg);}85%{transform:rotate(3deg);}100%{transform:translate(0) scale(1) rotate(0deg);}}.trippy-element{animation:chromatic-abhorration 10s infinite linear;}@keyframes blurry{from{filter:blur(0vmin);}to{filter:blur(0.3vmin);}}.blurry-vision.animating{animation:blurry 0.5s infinite alternate;}fieldset{margin:auto;max-width:300px;}fieldset input{width:100%;}input:invalid{box-shadow:0 0 2vmin 2vmin red;}iframe{animation:fadeIn 2s linear;}.mainhead{position:relative;animation:flowing 0.3s forwards;height:20vmin;width:100%;margin:0;padding:0 4vmin;font-size:x-large;text-align:center;}h5{margin:0;padding:0;color:var(--primaccent);}button:hover{animation:blurry 0.2s;}body{display:block;padding:0vmin;margin:0vmin;background:var(--background);color:var(--text);height:100vmin;text-align:center;font-size:4vmin;overflow:hidden;}header{position:absolute;top:0;left:0;bottom:90%;right:0;border-bottom:1px solid var(--borders);}header img{height:100%;}main{position:absolute;top:10%;left:0;bottom:10%;right:25%;overflow-y:scroll;overflow-x:hidden;background:var(--background2);padding:0;margin:0;}main img{max-width:100%;}a{color:var(--text2);text-decoration:none;}aside{position:absolute;top:10%;left:75%;bottom:10%;right:0;overflow-y:scroll;overflow-x:hidden;background:var(--secaccent);font-size:3.6vmin;text-align:center;border-left:1px solid var(--borders);}aside img{max-width:100%;height:20vmin;}nav{min-height:100%;width:100%;background:var(--primaccent);border-top:1px solid var(--borders);}nav ul{padding:0.5vmin 0vmin;margin:0vmin 1vmin;list-style-type:none;}nav li{display:block;padding:1vmin 0;margin:0.5vmin 0;background:var(--background2);border:1px solid var(--text);}nav li:hover{background:var(--text);color:var(--background);border:1px solid black;}.subnav{margin-left:1.5vmin;box-shadow:-1.5vmin 0 2vmin -1vmin var(--text);border-radius:1.4vmin 0 0 1.4vmin;color:var(--text2);background:var(--background);text-align:center;}footer{position:absolute;top:90%;left:0;bottom:0;right:0;border-top:1px solid var(--borders);}#dialog{max-height:90%;max-width:90%;box-shadow:0 0 10vmin 2vmin;background:rgba(0,0,0,0.8);border:0.2vmin solid var(--borders);border-radius:2vmin;padding:1vmin;}#dialog img{max-width:98%;max-height:90%;overflow:hidden;}.card{width:90%;background-color:var(--background);padding:2vmin;border-radius:3vmin;margin:2vmin auto;border:1px solid var(--borders);}.card-header{border-bottom:1px solid var(--borders);margin:0 0 2vmin 0;padding:0 0 2vmin 0;text-align:left;}.card-title{font-weight:bold;color:#fff;margin:0;padding:0 2vmin;}.card-post{font-weight:normal;color:#fff;text-align:left;margin:2vmin 0;}.indent{text-indent:5vmin;}#mainframe{padding:0;margin:0;width:100%;height:100%;}#btnportfolio,#btnsoupsynh{display:none;}#btndev{float:right;opacity:0;}@media (aspect-ratio:1/1){body,p,h2{background:pink;color:black;}}@media (orientation:landscape){main{position:absolute;top:10%;left:0;bottom:10%;right:12%;}aside{position:absolute;top:10%;left:87%;bottom:10%;right:0;font-size:2.2vmin;}button{font-size:2.2vmin;}}.pianocont{display:inline;width:100%;height:10%;margin:0;padding:0;}.pianocont button{float:left;box-sizing:border-box;height:100%;width:calc(100% / 25);margin:0;padding:0;border:0px solid red;outline:none;background-color:transparent;padding:0;margin:0;}.pianocont .white{background-color:#fff;box-shadow:0 5vmin 1vmin 0 inset grey;}.pianocont .black{background-color:rgba(60,20,20,1);box-shadow:0 3vmin 1vmin 0 inset black,0 -1vmin 1vmin 0 inset darkgrey;}hr{border:0px solid var(--borders);border-top:1px solid var(--borders);}.label{width:fit-content;max-width:90%;background-color:var(--background);padding:0 3vmin;border-radius:3vmin 3vmin 0 0;margin:1vmin auto;border:1px solid var(--borders);}.label p{margin:0;padding:0;color:var(--text2);}.card.fancy{background-image:linear-gradient(45deg,var(--background2) 25%,transparent 25%,transparent 75%,var(--background2) 75%);background-size:10vmin 10vmin;background-blend-mode:multiply;}.code-comment{color:var(--secaccent);}.code-constant,.code-boolean{color:var(--text2);}.code-variable,.code-function{color:var(--text);}.code-color,.code-number{color:var(--primaccent);}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}.image-div{flex:0 0 auto;scroll-snap-align:start;position:relative;width:100%;}.carousel-image{max-width:100%;height:auto;display:block;}
</style>
</head>
<body>
<header id="header"><img src="assets/header.svg"></header>
<main id="main"></main>
<aside id="aside"><img src="assets/nav.svg"><nav id="nav"></nav></aside>
<dialog id="dialog" class="shakey"></dialog>
<button id="btndev" onclick="devclick()" style="float:right;opacity:0">just tests</button>
<footer id="footer"><sup>Powered by <a href='https://github.com/SoupNet-Technologies/SPDRM'>SPDRM</a></sup></footer>
<script>
function html(strings, ...values) { let out = ''; const nodes = []; for (let i = 0; i < strings.length; i++) { out += strings[i]; if (i < values.length) { const v = values[i]; if (v === null || v === undefined) continue; if (Array.isArray(v)) { for (const item of v) { if (item instanceof Node) { nodes.push(item); out += `<!--ph${nodes.length - 1}-->`; } else { out += String(item).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
}
} else if (v instanceof Node) {
nodes.push(v);
out += `<!--ph${nodes.length - 1}-->`;
} else {
out += String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); } } } const el = document.createElement('div'); el.innerHTML = out; if (nodes.length) { const walker = document.createTreeWalker(el, NodeFilter.SHOW_COMMENT, null, false); while (walker.nextNode()) { const match = walker.currentNode.nodeValue.match(/^ph(\d+)$/); if (match) { walker.currentNode.parentNode.replaceChild(nodes[+match[1]], walker.currentNode); } } } if (el.children.length === 1) return el.children[0]; const frag = document.createDocumentFragment(); frag.append(...Array.from(el.children)); return frag; } function initmain(title) { main.innerHTML = ""; main.append(html`
<div class="mainhead">
<h2 style="margin:0;padding:0;position:absolute;bottom:0;left:0">${title}</h2>
</div>
`); } function generateAd() { if (!adUrls || adUrls.length === 0) return; randomAd = adUrls[Math.floor(Math.random() * adUrls.length)]; if (!randomAd) return; if (randomAd.url) { main.append(html`<br><a href="${randomAd.url}" target="_blank"><img src="${randomAd.src}" style="height:30px;padding:0;margin:0;margin-bottom:6vmin"></a>`); } else { main.append(html`<br><img src="${randomAd.src}" style="height:30px;padding:0;margin:0;margin-bottom:6vmin">`); } } function createCard(title, post, more) { let card = document.createElement("div"); card.className = "card"; if (title) { card.append(html`<div class="card-header"><h3 class="card-title">${title}</h3></div>`); } if (post) { let postElement = document.createElement("p"); postElement.className = "card-post"; postElement.innerHTML = post; card.appendChild(postElement); } if (more) { card.appendChild(more); } main.appendChild(card); } function appendP(parent, text) { parent.append(html`<p style="text-align:center;margin-top:0"><sup>${text}</sup></p>`); } function zoomimg(s) { const src = s.src || (Array.isArray(s) ? s[0] : ""); const title = s.title || (Array.isArray(s) ? s[1] : ""); dialog.innerHTML = `<img src="${src}" onclick="window.dialog.close()"><h5>${title}</h5>`; dialog.showModal(); } function generateDialog(title, message) { dialog.innerHTML = `<button style="" onclick="window.dialog.close()">Exit</button><br><h2>${message}</h2><br><h5>${title}</h5>`; dialog.style = "min-width: 60%"; dialog.showModal(); } function randimg() { let width = main.offsetWidth; let height = main.offsetHeight - 4; let pixels = new Uint8ClampedArray(width * height * 4); let d = 0; for (let i = 0; i < pixels.length; i++) { let rnd = Math.floor(Math.random() * 256); let rndwt = Math.floor(Math.random() * 185) + 70; d++; switch (d) { case 1:  pixels[i] = rnd; break; case 2:  pixels[i] = rnd; break; case 3:  pixels[i] = rnd; break; default:  pixels[i] = rnd; d = 0; break; } } let image = new ImageData(pixels, width, height); let canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height; main.append(canvas); let context = canvas.getContext("2d"); context.putImageData(image, 0, 0); } function devclick() { aside.innerHTML += "<p>Dev</p>"; let buttons = [ { text: "Open Modal", action: () => generateDialog("hello", "it works"), }, { text: "Test Api", action: () => testapi() }, ]; buttons.forEach((b) => { let devbutton = document.createElement("button"); devbutton.innerHTML = b.text; devbutton.onclick = b.action; aside.append(devbutton); }); } function testapi() { $.ajax({ url: "path/to/php/script.php", type: "get", dataType: "json", success: function (data) {  var csvData = JSON.parse(data);  console.log(csvData["column1"]); console.log(csvData["column2"]); console.log(csvData["column3"]); }, }); } function isValidEmail(email) { const regex = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/; return regex.test(email); } function maybeAnimate() { var random = Math.random(); if (random < 0.5) { var element = document.querySelector(".blurry-vision"); element.classList.add("animating"); setTimeout(function () { element.classList.remove("animating"); }, 1000); } } const mandelbrotSVG = '<svg width="280" height="280"><rect x="0" y="0" width="200" height="200" fill="black" /><g transform="translate(140,140) scale(69,69)"><path d="M-1,0C-1,0.6-0.6,1,0,1C0.6,1,1,0.6,1,0C1,-0.6,0.6,-1,0,-1C-0.6,-1,-1,-0.6,-1,0Z" fill="rgba(255,0,230,0.8)" /><g><circle cx="-1" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /><circle cx="1" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /></g><g><circle cx="0" cy="1" r="1" fill="rgba(255,0,0,0.8)" stroke="#fff" stroke-width="0.01" /><circle cx="0" cy="-1" r="1" fill="rgba(255,0,200,0.8)" stroke="#fff" stroke-width="0.01" /></g><g><circle cx="0" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /></g></g></svg>'; function createMandelbrotSVG(width, height, element, arr) { let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", width); svg.setAttribute("height", height); svg.style = "transform: scale(" + arr[4].inprng.value + ") rotate(90deg)"; for (let x = 0; x < width; x++) { for (let y = 0; y < height; y++) { const value = calculateMandelbrotValue(x, y, width, height, arr); const rect = document.createElementNS( "http://www.w3.org/2000/svg", "rect" ); let colls = ["red", "blue", "orange", "purple", "green"]; let cull = "rgb(255," + (255 - value) + ", 255)"; rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", 1); rect.setAttribute("height", 1); rect.setAttribute("fill", cull); rect.setAttribute("stroke", "none"); svg.appendChild(rect); } } element.innerHTML = ""; element.appendChild(svg);  } function calculateMandelbrotValue(x, y, w, h, arr) { const scaleX = 4 / w; const scaleY = 4 / h; const cx = x * scaleX - 2; const cy = y * scaleY - 2; let zx = 0; let zy = 0; let MAX_ITERATIONS = arr[5].inputval; for (let i = 0; i < MAX_ITERATIONS; i++) { const zx2 = zx * zx - zy * zy + cx; const zy2 = 2 * zx * zy + cy; if (zx2 * zx2 + zy2 * zy2 > 4) { return i; } zx = zx2; zy = zy2; } return MAX_ITERATIONS; }
const adUrls=[ {src:"assets/ads/ad1.svg",url:"https://github.com/SoupNet-Technologies/SPDRM"}, {src:"assets/ads/ad2.svg",url:""}, {src:"assets/ads/ad3.svg",url:""}, ];
const siteData={title:"SPDRM",seotitle:" • SPDRM",tagline:"the single page dynamic response model"};
const routes={ home:{ title:"One JSON file. One HTML file. That's the site.", render(){ createCard("hi, welcome to the demo", "Everything you're looking at right now came out of a single <code>site_data.json</code> file and got compiled into one self-contained <code>index.html</code> by a ~450-line Python script with zero dependencies. No node_modules. No bundler. No framework. There is no build step you need to fear.<br><br>Click around. The nav on the right, the routes, the little tools, the gallery, the synth — all of it is data." ); createCard("the pitch", "SPDRM started in 2022 as a WordPress replacement: a newspaper layout with a sticky header and footer, independently scrolling regions, and every piece of content living in a variable instead of a page file. The page <em>responds</em> to navigation dynamically — that's the whole \"Dynamic Response Model\" thing.<br><br>It has been quietly serving real sites since. This repo is it, cleaned up and set free." ); createCard("what to poke at", "The <b>Tools</b> section has interactive routes (palindrome checker, pig latin, a frame-rate converter) — those are just HTML strings in the JSON with an optional <code>onload</code> hook. The <b>Gallery</b> is a route type. The <b>Synth</b> is an optional module. The <b>Abyss</b> is a route type, not a joke. Well. Both." ); }, meta:["Welcome","SPDRM demo site",""] }, about:{ title:"About", noAd:true, render(){ createCard("why it exists", "Because updating a WordPress site meant logging into a dashboard, and updating this site means editing a JSON file and running one command. One of those feels like work. The other feels like publishing.<br><br>The builder validates your whole site before it writes anything — bad route, bad nav slug, missing field, the build dies loudly instead of shipping quietly broken." ); createCard("honest limitations", "Routing is hash-based (<code>#about</code>) and uses <code>location.replace</code>, so the back button leaves the site instead of walking your route history — that's deliberate for now, and a History API router is on the roadmap for v0.2. SEO meta is set client-side after render. The minifier is a conservative regex pass, not a real one. All of this is in the SPEC, in writing, where it can't be denied." ); }, meta:["About","",""] }, overview:{ title:"Overview", noAd:true, render(){ createCard("What is SPDRM?", "SPDRM (Single Page Dynamic Response Model) is a lightweight framework for creating single-page sites using vanilla JavaScript. No build tools, no dependencies — just HTML, CSS, and JS. A stdlib-Python builder turns your content into one self-contained page." ); createCard("Quick Facts", "<b>Language:</b> Vanilla JavaScript (ES6+)<br><b>Builder:</b> Python 3, stdlib only<br><b>Dependencies:</b> Zero<br><b>Server requirements:</b> None (static files only)<br><b>Routing:</b> Hash-based declarative route objects<br><b>Rendering:</b> Dynamic DOM manipulation via utility functions" ); }, meta:["Overview","What SPDRM is, in two cards.",""] }, "getting-started":{ title:"Getting Started", noAd:true, render(){ createCard("Setup", "Clone the repo and build: <code>python3 spdrm/build.py</code>, then serve the root with any static file server (<code>python3 -m http.server 8000</code>). No package install, no bundler, no server requirements. The builder validates the entire site and writes <code>index.html</code>, <code>manifest.json</code>, and <code>sitemap.xml</code>." ); createCard("File Structure", "The moving parts:<br><br><code>spdrm/build.py</code> — the builder (validate, minify, assemble)<br><code>spdrm/site_data.json</code> — your whole site: routes, nav, meta, layout<br><code>spdrm/src/</code> — the runtime: router.js, utils.js, tools.js, style.css (+ optional modules)<br><code>index.html</code> — generated, never hand-edit<br><br>Editing content means editing the JSON (or using the Tkinter editor, <code>spdrm/gui_editor.py</code>) and rebuilding." ); createCard("Deploying", "The output is static files, so any host works: Cloudflare Pages, GitHub Pages, Apache, nginx, a Raspberry Pi on a shelf. Hash routing means no server rewrites anywhere. Full recipes are in <code>docs/deploying.md</code>." ); }, meta:["Getting Started","How to set up and run an SPDRM application.",""] }, architecture:{ title:"Architecture", noAd:true, render(){ createCard("Concept", "SPDRM is a declarative routing model. Instead of routing logic scattered across switch statements or external libraries, each page or view is defined as an entry in a <code>routes</code> object with properties that tell the router how to render it." ); createCard("Route types", "In <code>site_data.json</code>, every route has a <code>type</code>:<br><br><b><code>content</code></b> — title + cards (the card is the one UI primitive everything is made of)<br><b><code>interactive</code></b> — raw HTML plus an optional <code>onload</code> hook (the tools use this)<br><b><code>gallery</code></b> — rows of {src, title} images, click one to zoom it in the modal<br><b><code>iframe</code></b> — embeds a URL<br><b><code>abyss</code></b> — full-screen canvas RGB noise. It is what it sounds like.<br><b><code>404</code></b> — error body, auto-redirects home" ); createCard("Route Properties", "At runtime the router (<code>move()</code>) inspects the route's properties to determine how to render it:<br><br><b><code>title</code></b> — Sets a page heading via <code>initmain(title)</code><br><b><code>render()</code></b> — Function that populates content (usually calling <code>createCard()</code>)<br><b><code>iframe</code></b> — URL for an embedded iframe; if present, <code>title</code>/<code>render</code> are skipped<br><b><code>bgImage</code></b> — URL for a full-page background image with CSS blend-mode<br><b><code>is404</code></b> — Flag for 404/redirect routes<br><b><code>isAbyss</code></b> — Flag for canvas noise generator routes<br><b><code>meta</code></b> — Array of <code>[title, description, keywords]</code> for SEO" ); createCard("Dispatcher Logic", "The router checks route properties in priority order:<br><br>1. If <code>is404</code> — render error, update URL, load meta, return<br>2. If <code>isAbyss</code> — clear content, run <code>randimg()</code>, update URL, load meta, return<br>3. If <code>iframe</code> — embed the iframe, update URL, load meta, return<br>4. If <code>title</code> — initialize the page heading<br>5. If <code>bgImage</code> — set background image on main<br>6. If <code>render</code> — call the render function<br>7. Always — generate a random ad (renders nothing if the ads array is empty), update URL hash, load SEO meta" ); createCard("Content Lifecycle", "When a route is activated, the content area is cleared and rebuilt in this sequence:<br><br><code>initmain(title)</code> → <code>bgImage</code> → <code>route.render()</code> → <code>generateAd()</code> → <code>moveurl(s)</code> → <code>loadmeta()</code>" ); }, meta:["Architecture","The declarative routing model behind SPDRM.",""] }, "api-index":{ title:"API: index.js", noAd:true, render(){ createCard("<code>siteData</code>", "Global configuration object with <code>title</code>, <code>seotitle</code> (appended to document titles), and <code>tagline</code>." ); createCard("<code>routes</code>", "The central routing table. Each key is a URL slug, and each value is a route config object. The router looks up <code>routes[s]</code> and falls back to <code>routes.home</code> if the key doesn't exist. Properties: <code>title</code>, <code>render()</code>, <code>iframe</code>, <code>bgImage</code>, <code>is404</code>, <code>isAbyss</code>, <code>meta</code>." ); createCard("<code>move(s)</code>", "Main router. Accepts a route key string, looks it up in <code>routes</code>, dispatches by property inspection (iframe, is404, isAbyss, title, bgImage, render), updates URL hash, and loads SEO meta." ); createCard("<code>loadnav()</code>", "Builds the sidebar navigation from an array of nav item objects. Each item can have <code>title</code>, <code>click</code>, and nested <code>children</code> (sub-nav items). Rendered as an unordered list." ); createCard("<code>moveurl(s)</code>", "Updates <code>window.location.hash</code> to reflect the current page. Uses <code>window.location.replace</code> so the hash changes without creating extra history entries." ); createCard("<code>loadmeta(title, desc, keywords)</code>", "Updates the page <code>&lt;title&gt;</code> and <code>meta[name=description]</code> and <code>meta[name=keywords]</code> attributes for SEO." ); createCard("<code>window.onload</code>", "Entry point. Reads <code>window.location.hash</code>, strips the <code>#</code>, and calls <code>move(hash)</code>. Falls back to <code>routes.home</code> if the hash is empty or doesn't match any route." ); }, meta:["API: index.js","Core SPDRM functions: routes, move, loadnav, moveurl, loadmeta.",""] }, "api-utils":{ title:"API: utils.js", noAd:true, render(){ createCard("<code>html(strings, ...values)</code>", "Tagged template literal for safe DOM construction. Escapes HTML in string values but allows <code>Node</code> objects to be interpolated directly. Returns a single element or document fragment." ); createCard("<code>initmain(title)</code>", "Clears <code>main</code> and appends a styled heading element with <code>mainhead</code> class and the given title." ); createCard("<code>createCard(title, post, more)</code>", "Creates a styled card component with an optional header, body text (<code>innerHTML</code>), and an optional appended element. Cards are appended to <code>main</code>." ); createCard("<code>generateAd()</code>", "Picks a random ad from the <code>ads</code> array in site_data and appends it to <code>main</code>. Renders nothing when the array is empty. Routes can opt out with <code>ads: false</code>." ); createCard("<code>appendP(parent, text)</code>", "Appends a small superscript-styled paragraph to a given parent element." ); createCard("<code>zoomimg(s)</cod this.sustain = 0.5;
this.release = 0.3;
this.cutoff = 20000; //(audioContext.sampleRate/2) - 20000
this.resonance = 0; // 0-1000
}

playFreq(frequency, duration) {
const oscillator = this.audioContext.createOscillator();
oscillator.frequency.value = frequency;
oscillator.connect(this.audioContext.destination);

oscillator.start();

this.oscillators.push(oscillator);

setTimeout(() => {
oscillator.stop();
}, duration);
}
playNote(note, duration) {
const oscillator = this.audioContext.createOscillator();
oscillator.frequency.value = this.noteToFrequency(note);

const filter = this.audioContext.createBiquadFilter();
filter.type = "lowpass";
filter.frequency.value = this.cutoff;
filter.Q.value = this.resonance;
oscillator.connect(filter);
filter.connect(this.effectsBus);
this.adsr = this.audioContext.createGain();
this.adsr.gain.value = 0;
oscillator.connect(this.adsr);
this.adsr.connect(this.audioContext.destination);
oscillator.start();
let attack = this.attack - 0.1;
let release = this.release - 0.1;
this.adsr.gain.linearRampToValueAtTime(
1,
this.audioContext.currentTime + attack
);
this.adsr.gain.linearRampToValueAtTime(
this.sustain,
this.audioContext.currentTime + attack + this.decay
);
setTimeout(() => {
this.adsr.gain.linearRampToValueAtTime(
0,
this.audioContext.currentTime + release
);
oscillator.stop();
}, duration);
this.oscillators.push(oscillator);
}

noteToFrequency(note) {
return Math.pow(2, (note - 69) / 12) * 440;
}

playSequence(sequence, tempo) {
this.sequencer = sequence;
let interval = 60000 / tempo; // interval in ms

this.sequencer.forEach((note) => {
setTimeout(() => {
if (Number.isInteger(note.time)) {
seqGui(note.time + 1);
}
this.playNote(note.note, getNoteDuration(tempo, note.duration));

//this.playNote(note.note, synth.release * 100);
}, note.time * interval);
});
}

stop() {
this.oscillators.forEach((oscillator) => {
oscillator.stop();
});
}
}

// highlight module — recovered from the deployed spdrm.com snapshot
// (modules/highlight.js). A conservative regex syntax highlighter for
// <code class="language-php"> and <code class="language-js"> blocks.
// Colors come from the .code-* classes in style.css.
// Enable with "modules": ["highlight"], then call highlight("js") / highlight("php")
// after your content renders.

const patternPHP = {
'color': /#([0-9a-fA-F]{3}){1,2}\b/g,
'variable': /\$[a-zA-Z_\x80-\xff][a-zA-Z0-9_\x80-\xff]*/g,
'number': /\b-?(?:0x[\da-f]+|\d*\.?\d+(?:e-?\d+)?)\b/gi,
'function': /[a-z0-9_]+(?=\()/gi,
'boolean': /\b(?:true|false|null)\b/g,
'constant': /\b[A-Z_][A-Z0-9_]*\b/g,
'comment': /\/\/.*|\/\*[^]*?\*\//g,
};
const patternJS = {
'color': /#([0-9a-fA-F]{3}){1,2}\b/g,
'variable': /[a-zA-Z_$][0-9a-zA-Z_$]*/g,
'number': /\b-?(?:0x[\da-f]+|\d*\.?\d+(?:e-?\d+)?)\b/gi,
'function': /[a-z_$][a-zA-Z0-9_$]*(?=\()/gi,
'boolean': /\b(?:true|false|null)\b/g,
'constant': /\b[A-Z_][A-Z0-9_]*\b/g,
'comment': /\/\/.*|\/\*[^]*?\*\//g,
};
function syntaxer(lang, code) {
switch (lang) {
case "php":
for (let syntax in patternPHP) {
code = code.replace(patternPHP[syntax], `<span class="code-${syntax}">$&</span>`);
}
break;
case "js":
for (let syntax in patternJS) {
code = code.replace(patternJS[syntax], `<span class="code-${syntax}">$&</span>`);
}
break;
default:
break;
}
return code;
}
function highlight(lang = "php") {
document.querySelectorAll('code').forEach(codeElement => {
if (codeElement.classList.contains(("language-" + lang))) {
codeElement.innerHTML = syntaxer(lang, codeElement.innerHTML);
}
});
}
