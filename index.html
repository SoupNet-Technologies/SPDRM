out += String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); } } } const el = document.createElement('div'); el.innerHTML = out; if (nodes.length) { const walker = document.createTreeWalker(el, NodeFilter.SHOW_COMMENT, null, false); while (walker.nextNode()) { const match = walker.currentNode.nodeValue.match(/^ph(\d+)$/); if (match) { walker.currentNode.parentNode.replaceChild(nodes[+match[1]], walker.currentNode); } } } if (el.children.length === 1) return el.children[0]; const frag = document.createDocumentFragment(); frag.append(...Array.from(el.children)); return frag; } function initmain(title) { main.innerHTML = ""; main.append(html`

document.createElement("canvas"); canvas.width = width; canvas.height = height; main.append(canvas); let context = canvas.getContext("2d"); context.putImageData(image, 0, 0); } function devclick() { aside.innerHTML += "<p>Dev</p>"; let buttons = [ { text: "Open Modal", action: () => generateDialog("hello", "it works"), }, { text: "Test Api", action: () => testapi() }, ]; buttons.forEach((b) => { let devbutton = document.createElement("button"); devbutton.innerHTML = b.text; devbutton.onclick = b.action; aside.append(devbutton); }); } function testapi() { $.ajax({ url: "path/to/php/script.php", type: "get", dataType: "json", success: function (data) {  var csvData = JSON.parse(data);  console.log(csvData["column1"]); console.log(csvData["column2"]); console.log(csvData["column3"]); }, }); } function isValidEmail(email) { const regex = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/; return regex.test(email); } function maybeAnimate() { var random = Math.random(); if (random < 0.5) { var element = document.querySelector(".blurry-vision"); element.classList.add("animating"); setTimeout(function () { element.classList.remove("animating"); }, 1000); } } const mandelbrotSVG = '<svg width="280" height="280"><rect x="0" y="0" width="200" height="200" fill="black" /><g transform="translate(140,140) scale(69,69)"><path d="M-1,0C-1,0.6-0.6,1,0,1C0.6,1,1,0.6,1,0C1,-0.6,0.6,-1,0,-1C-0.6,-1,-1,-0.6,-1,0Z" fill="rgba(255,0,230,0.8)" /><g><circle cx="-1" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /><circle cx="1" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /></g><g><circle cx="0" cy="1" r="1" fill="rgba(255,0,0,0.8)" stroke="#fff" stroke-width="0.01" /><circle cx="0" cy="-1" r="1" fill="rgba(255,0,200,0.8)" stroke="#fff" stroke-width="0.01" /></g><g><circle cx="0" cy="0" r="1" fill="none" stroke="#fff" stroke-width="0.01" /></g></g></svg>'; function createMandelbrotSVG(width, height, element, arr) { let svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("width", width); svg.setAttribute("height", height); svg.style = "transform: scale(" + arr[4].inprng.value + ") rotate(90deg)"; for (let x = 0; x < width; x++) { for (let y = 0; y < height; y++) { const value = calculateMandelbrotValue(x, y, width, height, arr); const rect = document.createElementNS( "http://www.w3.org/2000/svg", "rect" ); let colls = ["red", "blue", "orange", "purple", "green"]; let cull = "rgb(255," + (255 - value) + ", 255)"; rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", 1); rect.setAttribute("height", 1); rect.setAttribute("fill", cull); rect.setAttribute("stroke", "none"); svg.appendChild(rect); } } element.innerHTML = ""; element.appendChild(svg);  } function calculateMandelbrotValue(x, y, w, h, arr) { const scaleX = 4 / w; const scaleY = 4 / h; const cx = x * scaleX - 2; const cy = y * scaleY - 2; let zx = 0; let zy = 0; let MAX_ITERATIONS = arr[5].inputval; for (let i = 0; i < MAX_ITERATIONS; i++) { const zx2 = zx * zx - zy * zy + cx; const zy2 = 2 * zx * zy + cy; if (zx2 * zx2 + zy2 * zy2 > 4) { return i; } zx = zx2; zy = zy2; } return MAX_ITERATIONS; }

const routes={ home:{ title:"One JSON file. One HTML file. That's the site.", render(){ createCard("hi, welcome to the demo", "Everything you're looking at right now came out of a single <code>site_data.json</code> file and got compiled into one self-contained <code>index.html</code> by a ~450-line Python script with zero dependencies. No node_modules. No bundler. No framework. There is no build step you need to fear.<br><br>Click around. The nav on the right, the routes, the little tools — all of it is data." ); createCard("the pitch", "SPDRM started in 2022 as a WordPress replacement: a newspaper layout with a sticky header and footer, independently scrolling regions, and every piece of content living in a variable instead of a page file. The page <em>responds</em> to navigation dynamically — that's the whole \"Dynamic Response Model\" thing.<br><br>It has been quietly serving real sites since. This repo is it, cleaned up and set free." ); createCard("what to poke at", "The <b>Tools</b> section has interactive routes (palindrome checker, pig latin, a frame-rate converter) — those are just HTML strings in the JSON with an optional <code>onload</code> hook. The <b>Abyss</b> link is a route type, not a joke. Well. Both." ); }, meta:["Welcome","SPDRM demo site",""] }, about:{ title:"About", noAd:true, render(){ createCard("why it exists", "Because updating a WordPress site meant logging into a dashboard, and updating this site means editing a JSON file and running one command. One of those feels like work. The other feels like publishing.<br><br>The builder validates your whole site before it writes anything — bad route, bad nav slug, missing field, the build dies loudly instead of shipping quietly broken." ); createCard("honest limitations", "Routing is hash-based (<code>#about</code>) and uses <code>location.replace</code>, so the back button leaves the site instead of walking your route history — that's deliberate for now, and a History API router is on the roadmap for v0.2. SEO meta is set client-side after render. The minifier is a conservative regex pass, not a real one. All of this is in the SPEC, in writing, where it can't be denied." ); }, meta:["About","",""] }, tools:{ title:"Tools", noAd:true, render(){ initmain("Tools"); main.insertAdjacentHTML("beforeend",`<p><sup>little machines, assembled from JSON</sup></p>`); loadtools(); }, meta:["Tools","",""] }, palindrome:{ title:"Palindrome Checker", noAd:true, render(){ initmain("Palindrome Checker"); main.insertAdjacentHTML("beforeend",`<input id='palInput' placeholder='Enter a word or phrase'><button onclick='document.getElementById(\"palOut\").innerText=isPalindrome(document.getElementById(\"palInput\").value)'>Check</button><div id='palOut' style='margin-top:1em;font-size:1.2em'></div>`); if(!window._palSeeded){window._palSeeded=true;const d=document.createElement('details');d.innerHTML='<summary>need inspiration?</summary>'+paldefaults.map(p=>'&bull; '+p).join('<br>');document.getElementById('main').appendChild(d);}; }, meta:["Palindromes","",""] }, piglatin:{ title:"Pig Latin Translator", noAd:true, render(){ initmain("Pig Latin Translator"); main.insertAdjacentHTML("beforeend",`<input id='pigInput' placeholder='Enter sentence'><button onclick='document.getElementById(\"pigOut\").innerText=translateToPigLatin(document.getElementById(\"pigInput\").value)'>Translate</button><div id='pigOut' style='margin-top:1em;font-size:1.2em'></div>`); }, meta:["Pig Latin","",""] }, keyframer:{ title:"Keyframer", noAd:true, render(){ initmain("Keyframer"); main.insertAdjacentHTML("beforeend",`<p><sup>frames &lt;-&gt; seconds &lt;-&gt; fps</sup></p>`); loadkf(); }, meta:["Keyframer","",""] }, abyss:{ isAbyss:true, meta:["The Abyss","",""] }, notfound:{ is404:true, render(){ main.innerHTML="This page does not exist. Taking you home..."; setTimeout(()=>move("home"),2000); }, meta:["Lost","",""] }, };
function loadnav(){ let navitems=[ { title:"Home", click:()=>move("home"), children:[ { title:"About", click:()=>move("about"), }, { title:"Abyss", click:()=>move("abyss"), }, ] }, { title:"Tools", click:()=>move("tools"), children:[ { title:"Palindromes", click:()=>move("palindrome"), }, { title:"Pig Latin", click:()=>move("piglatin"), }, { title:"Keyframer", click:()=>move("keyframer"), }, ] }, ]; let navul=document.createElement("ul"); navitems.forEach((item)=>{ let navli=document.createElement("li"); navli.innerHTML=item.title; navli.onclick=item.click; navul.appendChild(navli); if(item.children&&item.children[0].hasOwnProperty("title")){ item.children.forEach((itemchild)=>{ let navlichild=document.createElement("li"); navlichild.innerHTML=itemchild.title; navlichild.className="subnav"; navlichild.onclick=itemchild.click; navul.appendChild(navlichild); }); } }); nav.appendChild(navul); }
function loadtools() { let toolsarr = [ { btntxt: "English to Pig Latin", btnclick: () => { move("piglatin"); }, }, { btntxt: "Video Shuffler", btnclick: () => { move("vidshuffle"); }, }, ]; toolsarr.forEach((e) => { let btn = document.createElement("button"); btn.innerText = e.btntxt; btn.onclick = e.btnclick; createCard(e.btntxt, "", btn);  }); } function isPalindrome(str) { str = str.replace(/[^a-z0-9]/gi, "").toLowerCase(); let reversed = str.split("").reverse().join(""); return reversed === str; } const paldefaults = [ "Ten animals I slam in a net", "Do geese see God?", "A Santa at NASA", "Dogma: I am God", "No devil lived on", "Too bad I hid a boot", "Yo, Banana Boy!", "Madam, in Eden I'm Adam", "Go deliver a dare, evil is afoot", "No lemon, no melon", "Do nine men interpret? Nine men, I nod", "Doc, note: I dissent. A fast never prevents a fatness. I diet on cod.", "Poor Dan is in a droop.", "Never odd or even.", "Mr. Owl ate my metal worm.", "Murder, for a jar of red rum", "Was it a rat I saw", "Senile felines", "Too hot to hoot", "Gateman sees name, garageman sees nametag", "Kayak", "Rise to vote, sir", "Tokyo, no pot", "Step on no pets", "Drab as a fool, aloof as a bard", "Niagara, o roar again", "A man, a plan, a canal, Panama", "Ma has a ham", "No sir, away, anxiety", "Was it a car or a cat I saw?", "Able was I ere I saw Elba", "Nurses run", "Lonely Tylenol", "Live, evil", "Sums are not set as a test on Erasmus", "No, it is op", "God saw I was dog", "Never odd or a eve", "Rats live on no evil star", "Won't lovers revolt now?", "Rise to vote, sirs", "Dammit, I'm mad", "A nut for a jar of tuna", "Egad, a base tone denotes a bad age", "Red rum, sir, is murder", "Was it a cat I saw?", "Race fast, safe car", "Too bad I hid a booty", "Yawn, o brave new world", "Go hang a salami, I'm a lasagna hog", "A tin mug for a jar of gum", "Evil olive", ]; function getAverage(numbers) { if (!Array.isArray(numbers)) { return null; } if (numbers.length === 0) { return 0; } let sum = 0; for (const num of numbers) { sum += num; } return sum / numbers.length; } function getValuesFromCSVFile(file) { let reader = new FileReader(); reader.onload = function () { let fileContents = reader.result; let rows = fileContents.split("\n"); let numbers = []; for (let row of rows) { let columns = row.split(","); for (let column of columns) { numbers.push(parseInt(column, 10)); } } return numbers; }; reader.readAsText(file); } function loadkf() { let kffield = document.createElement("div");  kffield.style = "display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 3vmin"; let kfinpstyle = "grid-column: 1 / span 3"; let kfinp = [["Time"], ["Frames"], ["FPS"]]; for (let i = 0; i < 3; i++) { kfinp[i][10] = document.createElement("input"); kfinp[i][10].style = kfinpstyle; kfinp[i][10].setAttribute("type", "number"); kfinp[i][20] = document.createElement("button"); kfinp[i][20].innerText = kfinp[i][0]; kfinp[i][20].onclick = (e) => { if ( /^\d+$/.test(kfinp[1][10].value) && /^\d+$/.test(kfinp[2][10].value) && e.srcElement.innerText == "Time" ) {  console.log("time work"); let p = Number(kfinp[1][10].value) / Number(kfinp[2][10].value); kfinp[0][10].value = p; } else if ( /^\d+$/.test(kfinp[0][10].value) && /^\d+$/.test(kfinp[2][10].value) && e.srcElement.innerText == "Frames" ) {  console.log("frames work"); let p = Number(kfinp[0][10].value) * Number(kfinp[2][10].value); kfinp[1][10].value = p; } else if ( /^\d+$/.test(kfinp[0][10].value) && /^\d+$/.test(kfinp[1][10].value) && e.srcElement.innerText == "FPS" ) {  console.log("fps work"); let p = Number(kfinp[1][10].value) / Number(kfinp[0][10].value); kfinp[2][10].value = p; } }; kffield.appendChild(kfinp[i][10]); kffield.appendChild(kfinp[i][20]); } createCard( "", "<details><summary>Read Me</summary>With Keyframer, you can easily and quickly convert between different time and frame rate units without having to do any manual calculations. Give it a try and see how much time and effort it can save you on your video projects.<ul><li>Input the values you know in two of the fields. For example, if you know the number of frames and the frame rate, enter those values in the corresponding fields.</li><li>Click the button next to the empty field to calculate the missing value. Keyframer will automatically fill in the empty field with the calculated value.</li><li>You can repeat this process as many times as needed to convert between frames, seconds, and FPS.</li></ul><br><b>Time</b> is a numeric value in seconds, 0.5 would be 500ms. <b>Frames</b> is a numeric value representing the total number of frames. <b>FPS</b> is a numeric value representing how many frames there are in a second.<br><br>That's it!<br></details>" ); createCard("KF", "<sub>fill in any two values</br>", kffield); } async function imageToAscii(fileInput, scale, textarea) { const reader = new FileReader(); reader.onload = function () { var img = new Image(); img.src = reader.result; console.log(textarea); img.onload = function () { var canvas = document.createElement("canvas"); var context = canvas.getContext("2d"); canvas.width = img.width / scale; canvas.height = img.height / scale; context.drawImage(img, 0, 0, canvas.width, canvas.height); var imageData = context.getImageData( 0, 0, canvas.width, canvas.height ); var data = imageData.data; var asciiArt = ""; for (var y = 0; y < canvas.height; y++) { var line = ""; for (var x = 0; x < canvas.width; x++) { var red = data[(canvas.width * y + x) * 4]; var green = data[(canvas.width * y + x) * 4 + 1]; var blue = data[(canvas.width * y + x) * 4 + 2]; var character = getCharacterForColor(red, green, blue); line += character; } asciiArt += line + "\n"; } console.log(asciiArt); textarea.value = asciiArt;  }; }; reader.readAsDataURL(fileInput.files[0]); } function getCharacterForColor(red, green, blue) { let brightness = (red + green + blue) / 3; let character = " "; if (brightness >= 240) { character = " "; } else if (brightness >= 220) { character = ".";
