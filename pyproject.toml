[project]
name = "spdrm"
version = "0.1.0"
description = "SPDRM — the Single Page Dynamic Response Model: one JSON file in, one self-contained HTML site out"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "SoupNet Technologies" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

# npm packaging is deferred — v0.1 ships GitHub-only, files stay copy-paste-able.
