name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  build:
    name: build demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 spdrm/build.py
      - name: generated artifacts must not be committed
        run: |
          if git diff --exit-code --quiet index.html; then
            echo "index.html matches HEAD (not yet committed at all — fine on first build)"
          fi
          if git ls-files --error-unmatch index.html.bak >/dev/null 2>&1; then
            echo "::error::index.html.bak is committed"; exit 1
          fi
      - name: size budget (index.html < 64 KB)
        run: |
          SIZE=$(wc -c < index.html)
          echo "index.html: $SIZE bytes"
          if [ "$SIZE" -ge 65536 ]; then
            echo "::error::index.html is $SIZE bytes, over the 64 KB budget"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: |
            index.html
            manifest.json
            sitemap.xml
            assets/
            403.html
            404.html
            500.html

  runtime-check:
    name: node syntax + built artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: source files parse
        run: |
          for f in spdrm/src/*.js; do node --check "$f"; done
      - name: built artifact passes node_check
        run: |
          python3 spdrm/build.py
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("b", "spdrm/build.py")
          b = importlib.util.module_from_spec(spec); spec.loader.exec_module(b)
          html = open("index.html").read()
          ok = b.node_check(html)
          assert ok, "node_check failed on the built artifact"
          print("node_check: OK")
          PY

  docs:
    name: docs lint + docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: markdownlint
        run: npx --yes markdownlint-cli README.md SPEC.md docs/*.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: prose style lint
        run: python3 tools/prose_lint.py README.md SPEC.md docs/deploying.md docs/data-model.md

  workflow-lint:
    name: yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - run: pip install yamllint
      - name: yamllint (workflows, relaxed)
        run: |
          cat > .yamllint.yaml <<'YML'
          extends: default
          rules:
            line-length: disable
            truthy: disable
            document-start: disable
          YML
          yamllint .github/workflows/
